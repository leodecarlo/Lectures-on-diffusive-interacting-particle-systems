name: Check PDF orientation

on:
  push:
    branches:
      - fix-pdf-orientation
    paths:
      - .github/workflows/pdf-orientation-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install --quiet pymupdf pypdf pillow pytesseract
      - name: Inspect PDF orientation
        run: |
          python - <<'PY'
          import glob, io, math, re
          from collections import Counter
          import fitz
          import pytesseract
          from PIL import Image
          from pypdf import PdfReader

          for path in sorted(glob.glob('**/*.pdf', recursive=True)):
              reader = PdfReader(path)
              doc = fitz.open(path)
              print(f'\n=== {path} ===')
              print(f'pages={len(reader.pages)}')
              for i in range(min(5, len(reader.pages))):
                  p = reader.pages[i]
                  w = float(p.mediabox.width)
                  h = float(p.mediabox.height)
                  rot = int(p.get('/Rotate', 0) or 0) % 360
                  print(f'page {i+1}: media={w:.1f}x{h:.1f} rotate={rot} ({"landscape" if w > h else "portrait" if h > w else "square"})')

                  page = doc[i]
                  directions = []
                  try:
                      td = page.get_text('dict')
                      for block in td.get('blocks', []):
                          for line in block.get('lines', []):
                              dx, dy = line.get('dir', (1.0, 0.0))
                              ang = int(round(math.degrees(math.atan2(dy, dx)))) % 360
                              directions.append(ang)
                      if directions:
                          print('  text_dirs:', Counter(directions).most_common(4))
                      else:
                          print('  text_dirs: none')
                  except Exception as e:
                      print('  text_dirs error:', e)

                  try:
                      pix = page.get_pixmap(matrix=fitz.Matrix(1.4, 1.4), alpha=False)
                      img = Image.open(io.BytesIO(pix.tobytes('png')))
                      osd = pytesseract.image_to_osd(img, config='--psm 0')
                      deg = re.search(r'Orientation in degrees:\s*(\d+)', osd)
                      rotate = re.search(r'Rotate:\s*(\d+)', osd)
                      conf = re.search(r'Orientation confidence:\s*([\d.]+)', osd)
                      print(f'  tesseract: orientation={deg.group(1) if deg else "?"} rotate={rotate.group(1) if rotate else "?"} confidence={conf.group(1) if conf else "?"}')
                  except Exception as e:
                      print('  tesseract: unavailable/failed:', str(e).replace('\n', ' ')[:240])
              doc.close()
          PY
