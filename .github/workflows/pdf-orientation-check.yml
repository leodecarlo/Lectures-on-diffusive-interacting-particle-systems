name: Fix PDF orientation

on:
  push:
    branches:
      - fix-pdf-orientation
    paths:
      - .github/workflows/pdf-orientation-check.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-pdf-orientation
      - name: Install PDF tools
        run: python -m pip install --quiet pypdf
      - name: Rotate handwritten PDFs to landscape
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader, PdfWriter

          # These two scanned handwritten note files are stored as portrait pages
          # while the writing itself is sideways. Rotate every page 90 degrees
          # counter-clockwise so the documents display horizontally.
          for filename in ["intro.pdf", "ch4KL.pdf"]:
              path = Path(filename)
              reader = PdfReader(str(path))
              writer = PdfWriter()
              for page in reader.pages:
                  page.rotate(270)
                  writer.add_page(page)
              tmp = path.with_suffix(".rotated.pdf")
              with tmp.open("wb") as f:
                  writer.write(f)
              tmp.replace(path)
              print(f"rotated {filename}: {len(reader.pages)} pages")
          PY
      - name: Verify landscape page orientation
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          for filename in ["intro.pdf", "ch4KL.pdf"]:
              r = PdfReader(filename)
              print(f"{filename}: {len(r.pages)} pages")
              for i, p in enumerate(r.pages, 1):
                  w = float(p.mediabox.width)
                  h = float(p.mediabox.height)
                  rot = int(p.get('/Rotate', 0) or 0) % 360
                  visual_landscape = (w > h and rot in (0,180)) or (h > w and rot in (90,270))
                  if not visual_landscape:
                      raise SystemExit(f"page {i} of {filename} is not visually landscape: {w}x{h}, rotate={rot}")
              print("  all pages visually landscape")
          PY
      - name: Commit corrected PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intro.pdf ch4KL.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "Rotate handwritten PDFs to landscape"
            git push origin fix-pdf-orientation
          fi
